 # Vampire Level Progression Plan
        # Defines stats and abilities gained at each level.
        version: ${version}
        levels:
          '0': # Level number as the key
            description: "Recently turned"
            max_blood: 10.0
            blood_regen_rate: 1.0 # Multiplier on base rate
            sun_modifier: 1.2 # Takes MORE damage from sun
            speed_boost: 1.0 # Base speed
            # Add other stats or ability flags here
            # Example: can_use_shriek: false
            can_use_shriek: false
          '1':
            description: "Basic vampire"
            max_blood: 20.0
            blood_regen_rate: 1.0
            sun_modifier: 1.0 # Standard sun damage
            speed_boost: 1.2
            can_use_shriek: true
            shriek_cooldown_modifier: 1.0 # Standard cooldown
            fall_damage_reduction: 0.1 # 10% reduction
          '2':
            description: "Elder Vampire"
            max_blood: 22.0
            blood_regen_rate: 1.1
            sun_modifier: 1.0
            speed_boost: 1.2
            shriek_cooldown_modifier: 0.9 # 10% faster cooldown
            fall_damage_reduction: 0.2 # 20% reduction
          '3':
            description: "Master Vampire"
            max_blood: 22.0
            blood_regen_rate: 1.1
            sun_modifier: 1.0
            speed_boost: 1.4
            shriek_cooldown_modifier: 0.8 # 20% faster cooldown
            fall_damage_reduction: 0.3 # 30% reduction
          '4':
            description: "Ancient Vampire"
            max_blood: 34.0
            blood_regen_rate: 1.3
            sun_modifier: 0.8
            speed_boost: 1.4
            shriek_cooldown_modifier: 0.7 # 30% faster cooldown
            fall_damage_reduction: 0.4 # 40% reduction
          '5':
            description: "Vampire Lord"
            max_blood: 50.0
            blood_regen_rate: 1.4
            sun_modifier: 0.7
            speed_boost: 1.6
            shriek_cooldown_modifier: 0.6 # 40% faster cooldown
            fall_damage_reduction: 0.6 # 60% reduction